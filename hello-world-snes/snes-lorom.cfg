MEMORY {
    ROM:     start = $8000, size = $7FC0, file = %O, fill = yes, fillval = $00;
    HEADER:  start = $FFC0, size = $0020, file = %O, fill = yes, fillval = $00;
    VECTORS: start = $FFE0, size = $0020, file = %O, fill = yes, fillval = $00;
    BANK1:   start = $8000, size = $8000, file = %O, fill = yes, fillval = $00;
    BANK2:   start = $8000, size = $8000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE:    load = ROM,     type = ro;
    HEADER:  load = HEADER,  type = ro;
    VECTORS: load = VECTORS, type = ro;
    TILES1:  load = BANK1,   type = ro;
    TILES2:  load = BANK2,   type = ro;
}
